<!doctype html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تحلیل کیفیت آب</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet"><link href="/css/app.css" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script></head><body><nav class="navbar navbar-dark bg-dark"><div class="container"><a class="navbar-brand" href="/">Nexora | Water Quality Monitor</a></div></nav><main class="container py-4"><div class="d-flex justify-content-between align-items-center mb-4"><div><h1 class="h3">تحلیل و نمودارها</h1><p class="text-secondary mb-0">نمایش روند تغییر شاخص‌های کیفیت آب</p></div><a href="/" class="btn btn-outline-dark">داشبورد</a></div><div class="row g-3 mb-4"><div class="col-6 col-lg"><div class="card shadow-sm h-100"><div class="card-body"><small class="text-secondary">میانگین pH</small><div class="h4 mt-2" th:text="${#numbers.formatDecimal(stats.averagePh(),1,2)}">0</div></div></div></div><div class="col-6 col-lg"><div class="card shadow-sm h-100"><div class="card-body"><small class="text-secondary">میانگین دما</small><div class="h4 mt-2"><span th:text="${#numbers.formatDecimal(stats.averageTemperature(),1,2)}">0</span> °C</div></div></div></div><div class="col-6 col-lg"><div class="card shadow-sm h-100"><div class="card-body"><small class="text-secondary">میانگین DO</small><div class="h4 mt-2" th:text="${#numbers.formatDecimal(stats.averageDissolvedOxygen(),1,2)}">0</div></div></div></div><div class="col-6 col-lg"><div class="card shadow-sm h-100"><div class="card-body"><small class="text-secondary">میانگین EC</small><div class="h4 mt-2" th:text="${#numbers.formatDecimal(stats.averageConductivity(),1,2)}">0</div></div></div></div></div><div th:if="${stats.count() == 0}" class="alert alert-info">برای نمایش تحلیل ابتدا چند اندازه‌گیری ثبت کنید.</div><div th:if="${stats.count() > 0}" class="row g-4"><div class="col-12"><div class="card shadow-sm"><div class="card-body"><h2 class="h6">روند pH و دما</h2><canvas id="phTempChart" height="90"></canvas></div></div></div><div class="col-12"><div class="card shadow-sm"><div class="card-body"><h2 class="h6">روند DO و EC</h2><canvas id="doEcChart" height="90"></canvas></div></div></div></div><script th:inline="javascript">const rows=/*[[${measurements}]]*/[];const labels=rows.map(x=>x.measuredAt?x.measuredAt.replace('T',' ').slice(0,16):'');const common={responsive:true,interaction:{mode:'index',intersect:false}};if(rows.length){new Chart(document.getElementById('phTempChart'),{type:'line',data:{labels,datasets:[{label:'pH',data:rows.map(x=>x.ph),tension:.25},{label:'Temperature °C',data:rows.map(x=>x.temperature),tension:.25}]},options:common});new Chart(document.getElementById('doEcChart'),{type:'line',data:{labels,datasets:[{label:'DO mg/L',data:rows.map(x=>x.dissolvedOxygen),tension:.25},{label:'EC µS/cm',data:rows.map(x=>x.conductivity),tension:.25}]},options:common});}</script></main></body></html>
