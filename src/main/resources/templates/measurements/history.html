<!doctype html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>سوابق اندازه‌گیری</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet"><link href="/css/app.css" rel="stylesheet"></head><body><nav class="navbar navbar-dark bg-dark"><div class="container"><a class="navbar-brand" href="/">Nexora | Water Quality Monitor</a></div></nav><main class="container py-4"><div class="d-flex justify-content-between align-items-center mb-4"><div><h1 class="h3">سوابق اندازه‌گیری</h1><p class="text-secondary mb-0">جستجو و فیلتر داده‌های ثبت‌شده</p></div><a href="/measurements/new" class="btn btn-primary">ثبت اندازه‌گیری جدید</a></div><div class="card shadow-sm mb-4"><div class="card-body"><form method="get" action="/measurements" class="row g-3"><div class="col-md-4"><label class="form-label">محل نمونه‌برداری</label><input class="form-control" name="location" th:value="${location}" placeholder="مثلاً آزمایشگاه مرکزی"></div><div class="col-md-3"><label class="form-label">از تاریخ</label><input type="datetime-local" class="form-control" name="from" th:value="${from}"></div><div class="col-md-3"><label class="form-label">تا تاریخ</label><input type="datetime-local" class="form-control" name="to" th:value="${to}"></div><div class="col-md-2 d-flex align-items-end"><button class="btn btn-dark w-100">اعمال فیلتر</button></div><div class="col-12"><a href="/measurements" class="btn btn-link">پاک کردن فیلترها</a></div></form></div></div><div class="card shadow-sm"><div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead><tr><th>زمان</th><th>محل</th><th>pH</th><th>دما °C</th><th>DO mg/L</th><th>EC µS/cm</th><th></th></tr></thead><tbody><tr th:each="m : ${measurements}"><td th:text="${#temporals.format(m.measuredAt,'yyyy-MM-dd HH:mm')}"></td><td th:text="${m.location}"></td><td th:text="${m.ph}"></td><td th:text="${m.temperature}"></td><td th:text="${m.dissolvedOxygen}"></td><td th:text="${m.conductivity}"></td><td><form th:action="@{'/measurements/' + ${m.id} + '/delete'}" method="post" onsubmit="return confirm('این رکورد حذف شود؟')"><button class="btn btn-sm btn-outline-danger">حذف</button></form></td></tr><tr th:if="${#lists.isEmpty(measurements)}"><td colspan="7" class="text-center py-5 text-secondary">رکوردی با این فیلترها پیدا نشد.</td></tr></tbody></table></div></div></main></body></html>
