<!doctype html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ثبت اندازه‌گیری</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet"><link href="/css/app.css" rel="stylesheet"></head><body><main class="container py-5"><div class="card shadow-sm mx-auto" style="max-width:760px"><div class="card-body p-4"><div class="d-flex justify-content-between mb-4"><h1 class="h4">ثبت داده کیفیت آب</h1><a href="/" class="btn btn-outline-secondary btn-sm">داشبورد</a></div><form th:action="@{/measurements}" th:object="${measurement}" method="post"><div class="row g-3"><div class="col-md-6"><label class="form-label">pH</label><input type="number" step="0.01" min="0" max="14" class="form-control" th:field="*{ph}" required></div><div class="col-md-6"><label class="form-label">دما (°C)</label><input type="number" step="0.01" class="form-control" th:field="*{temperature}" required></div><div class="col-md-6"><label class="form-label">اکسیژن محلول (mg/L)</label><input type="number" step="0.01" min="0" class="form-control" th:field="*{dissolvedOxygen}" required></div><div class="col-md-6"><label class="form-label">هدایت الکتریکی (µS/cm)</label><input type="number" step="0.01" min="0" class="form-control" th:field="*{conductivity}" required></div><div class="col-12"><label class="form-label">محل نمونه‌برداری</label><input class="form-control" th:field="*{location}" required></div><div class="col-12"><label class="form-label">توضیحات</label><textarea class="form-control" rows="3" th:field="*{notes}"></textarea></div></div><button class="btn btn-primary w-100 mt-4">ذخیره اندازه‌گیری</button></form></div></div></main></body></html>
