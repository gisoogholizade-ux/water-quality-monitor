<!doctype html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پایش کیفیت آب</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet"><link href="/css/app.css" rel="stylesheet"></head><body><nav class="navbar navbar-dark bg-dark"><div class="container"><span class="navbar-brand">Nexora | Water Quality Monitor</span></div></nav><main class="container py-4"><div class="d-flex flex-wrap gap-2 justify-content-between align-items-center mb-4"><div><h1 class="h3">داشبورد کیفیت آب</h1><p class="text-secondary mb-0">ثبت، مدیریت و مشاهده اندازه‌گیری‌ها</p></div><div class="d-flex gap-2"><a class="btn btn-outline-danger" href="/alerts">هشدارها</a><a class="btn btn-outline-success" href="/analysis">تحلیل و نمودارها</a><a class="btn btn-outline-dark" href="/measurements">مشاهده سوابق</a><a class="btn btn-primary" href="/measurements/new">ثبت اندازه‌گیری</a></div></div><div class="card shadow-sm mb-4"><div class="card-body"><div class="small text-secondary">تعداد کل رکوردها</div><div class="display-6" th:text="${count}">0</div></div></div><div class="card shadow-sm"><div class="card-header d-flex justify-content-between"><span>آخرین اندازه‌گیری‌ها</span><a href="/measurements" class="small">مشاهده همه</a></div><div class="table-responsive"><table class="table table-hover mb-0"><thead><tr><th>زمان</th><th>محل</th><th>pH</th><th>دما</th><th>DO</th><th>EC</th></tr></thead><tbody><tr th:each="m : ${measurements}"><td th:text="${#temporals.format(m.measuredAt,'yyyy-MM-dd HH:mm')}"></td><td th:text="${m.location}"></td><td th:text="${m.ph}"></td><td th:text="${m.temperature}"></td><td th:text="${m.dissolvedOxygen}"></td><td th:text="${m.conductivity}"></td></tr><tr th:if="${#lists.isEmpty(measurements)}"><td colspan="6" class="text-center py-4 text-secondary">هنوز داده‌ای ثبت نشده است.</td></tr></tbody></table></div></div></main></body></html>
